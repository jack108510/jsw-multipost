<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Amplr</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a25;
    --border: #252535;
    --text: #f0f0f5;
    --text-2: #9999b0;
    --text-3: #666680;
    --green: #10b981;
    --red: #ef4444;
    --gradient: linear-gradient(120deg, #5B6FE8 0%, #9B5DE5 55%, #F368A8 100%);
  }

  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .header svg { margin-bottom: 8px; }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
  }

  .body { padding: 24px 20px; }

  /* ---- LOGIN ---- */
  .field-group { margin-bottom: 12px; }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 6px;
    display: block;
  }
  .field-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    transition: border .15s;
  }
  .field-input:focus { outline: none; border-color: #5B6FE8; }
  .field-input::placeholder { color: var(--text-3); }

  .hint {
    font-size: 11px;
    color: var(--text-3);
    text-align: center;
    margin-top: 10px;
    line-height: 1.5;
  }
  .hint a { color: #5B6FE8; text-decoration: none; }

  .btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 16px;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--gradient); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,111,232,.3); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: var(--text-3); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text-2); border-color: var(--text-3); }

  /* ---- CONNECTED ---- */
  .connected-view { display: none; text-align: center; }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--green);
    margin: 0 auto 12px;
    box-shadow: 0 0 12px rgba(16,185,129,.4);
  }
  .connected-view .title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .connected-view .sub { font-size: 12px; color: var(--text-3); }

  .status {
    margin-top: 14px; font-size: 12px; text-align: center; min-height: 18px;
    color: var(--text-3);
  }
  .status.error { color: var(--red); }

  .footer {
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .footer a {
    font-size: 11px;
    color: var(--text-3);
    text-decoration: none;
    transition: color .15s;
  }
  .footer a:hover { color: var(--text-2); }
</style>
</head>
<body>

<div class="header">
  <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
    <defs><linearGradient id="pG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B6FE8"/><stop offset="55%" stop-color="#9B5DE5"/><stop offset="100%" stop-color="#F368A8"/>
    </linearGradient></defs>
    <path d="M8 20 a8 8 0 1 1 8 8 L16 12 L16 28" stroke="url(#pG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="16" y1="20" x2="28" y2="20" stroke="url(#pG)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="12" r="3" fill="#F368A8"/>
    <circle cx="32" cy="20" r="3" fill="#F368A8"/>
    <circle cx="28" cy="28" r="3" fill="#F368A8"/>
  </svg>
  <h1>amplr</h1>
  <p>Facebook Groups Autoposter</p>
</div>

<div class="body">

  <!-- Login -->
  <div id="dashDisconnected">
    <div class="field-group">
      <label class="field-label" for="loginEmail">Email</label>
      <input type="email" id="loginEmail" class="field-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field-group">
      <label class="field-label" for="loginPassword">Password</label>
      <input type="password" id="loginPassword" class="field-input" placeholder="Min 6 characters" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn">Sign In</button>
    <div class="hint" style="margin-top:14px;">
      Use the same account as the<br>
      <a href="https://jack108510.github.io/fb-autoposter/dashboard.html" target="_blank">Amplr Dashboard &rarr;</a>
    </div>
  </div>

  <!-- Connected -->
  <div id="dashConnected" class="connected-view">
    <div class="status-dot"></div>
    <div class="title">Connected</div>
    <div class="sub" id="dashJobStatus">Watching for posts from your dashboard</div>
    <div class="sub" id="dashEmail" style="margin-top:6px; opacity:0.7; font-size:11px;"></div>
    <button class="btn btn-primary" id="importGroupsBtn" style="margin-top:20px;">Import My Groups</button>
    <div id="importStatus" style="margin-top:10px; font-size:12px; color:var(--text-3); min-height:16px;"></div>
    <button class="btn btn-ghost" id="pairDisconnectBtn" style="margin-top:12px;">Sign Out</button>
  </div>

  <div class="status" id="dashStatus"></div>
</div>

<div class="footer">
  <a href="https://jack108510.github.io/fb-autoposter/dashboard.html" target="_blank">Open Dashboard &rarr;</a>
</div>

<script src="popup.js"></script>
</body>
</html>
